# Quellen für Vorjahres-Lineups (siehe src/festival_score/history.py).
# openairguide:    Slug auf openairguide.net/festivals/deutschland/<slug> (Lineup, Termin, Headliner);
#                  fehlt der Eintrag (z. B. Parookaville, dort 404), bleibt es bei Wikipedia.
# wikipedia:       Titel des Artikels auf de.wikipedia.org (null = kein passender Artikel);
#                  liefert Ticketpreis, Besucherzahl und gemeldete Bandanzahl.
# wikipedia_skip_sections: Abschnittsüberschriften, die ignoriert werden (andere Events im Artikel)
# name/location:   Anzeigename und Ort, weil die Quellen sie nicht einheitlich liefern.
festivals:
  rock-am-ring:
    name: Rock am Ring
    location: Nürburg
    wikipedia: Rock_am_Ring
    openairguide: rock-am-ring
  rock-im-park:
    name: Rock im Park
    location: Nürnberg
    wikipedia: Rock_im_Park
    openairguide: rock-im-park
  hurricane:
    name: Hurricane
    location: Scheeßel
    wikipedia: Hurricane_Festival
    openairguide: hurricane
  southside:
    name: Southside
    location: Neuhausen ob Eck
    wikipedia: Southside_Festival
    openairguide: southside
  wacken-open-air:
    name: Wacken Open Air
    location: Wacken
    wikipedia: Wacken_Open_Air
    wikipedia_skip_sections: [Wacken Winter Nights]   # eigene Veranstaltung mit eigener Tabelle
    openairguide: wacken-open-air
  lollapalooza-berlin:
    name: Lollapalooza Berlin
    location: Berlin
    wikipedia: null   # de.wikipedia hat keinen Artikel dazu
    openairguide: lollapalooza-berlin
  parookaville:
    name: Parookaville
    location: Weeze
    wikipedia: Parookaville
  deichbrand:
    name: Deichbrand
    location: Cuxhaven
    wikipedia: Deichbrand_Festival
    openairguide: deichbrand
  highfield-festival:
    name: Highfield Festival
    location: Großpösna
    wikipedia: Highfield_Festival
    openairguide: highfield-festival
